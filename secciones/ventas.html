<section id="seccion-ventas">
    <div class="row">
        <div class="col-md-7">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-search me-2"></i>Buscar Productos</h5>
                </div>
                <div class="card-body">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="productoSearch"
                            placeholder="Buscar por nombre o código..." autocomplete="off">
                        <button class="btn btn-outline-primary" type="button" id="btnCrearProductoVentas">
                            <i class="fas fa-plus-circle me-1"></i> Crear Producto
                        </button>
                    </div>
                    <div class="list-group" id="searchResults">
                    </div>
                </div>
            </div>

            <div class="row g-2" id="quick-access-products">
            </div>
        </div>

        <div class="col-md-5">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fa-solid fa-user me-2"></i>Cliente</h5>
                </div>
                <div class="card-body">
                    <!-- Buscador e input con autocompletado en vivo -->
                    <div class="position-relative" id="clienteSearchContainer">
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
                            <input class="form-control" list="clientesList" id="clienteSearch"
                                placeholder="Buscar por nombre, DNI o teléfono..." autocomplete="off">
                            <datalist id="clientesList"></datalist>
                            <button class="btn btn-outline-primary" type="button" id="btnAgregarCliente" title="Agregar Nuevo Cliente">
                                <i class="fas fa-user-plus me-1"></i>Nuevo
                            </button>
                            <button class="btn btn-warning" type="button" id="btnEditarCliente"
                                style="display:none;" title="Editar Cliente">
                                <i class="fas fa-user-edit"></i>
                            </button>
                        </div>
                        <!-- Lista flotante de resultados en vivo -->
                        <div id="clienteSearchResults" class="list-group position-absolute w-100 shadow-lg mt-1" style="z-index: 1060; max-height: 250px; overflow-y: auto; display: none;">
                        </div>
                    </div>

                    <!-- Tarjeta de cliente seleccionado con resumen de saldo/deuda -->
                    <div id="selectedClienteCard" class="mt-3 p-3 rounded-3 border bg-light" style="display: none;">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="d-flex align-items-center">
                                <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center me-3 fw-bold shadow-sm" id="selectedClienteAvatar" style="width: 42px; height: 42px; font-size: 1.1rem;">
                                    CF
                                </div>
                                <div>
                                    <h6 class="mb-0 fw-bold text-dark" id="selectedClienteNombre">Consumidor Final</h6>
                                    <div class="small text-muted" id="selectedClienteDetalle">DNI/CUIT: 99-99999999-9</div>
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-1">
                                <button class="btn btn-sm btn-outline-secondary" type="button" id="btnEditarClienteCard" title="Editar datos">
                                    <i class="fas fa-pen"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" type="button" id="btnQuitarCliente" title="Quitar cliente (Consumidor Final)">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Estado de Cuenta / Deuda -->
                        <div class="mt-2 pt-2 border-top d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center">
                                <span class="small text-muted me-2"><i class="fas fa-receipt me-1"></i>Cuenta Corriente:</span>
                                <span id="selectedClienteSaldoBadge" class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1">
                                    Al día ($0)
                                </span>
                            </div>
                            <button class="btn btn-sm btn-danger fw-bold shadow-sm" type="button" id="btnCobrarDeudaVentas" style="display: none;">
                                <i class="fas fa-hand-holding-usd me-1"></i>Cobrar Deuda
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0"><i class="fas fa-shopping-cart me-2"></i>Ticket de Compra</h5>
                </div>
                <div class="card-body">
                    <div class="list-group" id="ticketItems">
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-end align-items-center bg-light">
                    <h4 class="mb-0">Total: <span id="totalVenta" class="text-primary fw-bold">$0</span></h4>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0"><i class="fas fa-money-bill-wave me-2"></i>Métodos de Pago</h5>
                </div>

                <div class="card-body">
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <button id="btnPagoRapidoContado" class="btn btn-success btn-lg w-100 btn-pago-rapido"
                                data-metodo="contado" style="--btn-bg-color: #198754;">
                                <div class="d-flex justify-content-between align-items-center w-100">
                                    <span><i class="fas fa-hand-holding-usd me-2"></i>Contado</span>
                                    <span id="montoContadoRapido" class="badge bg-light text-dark ms-2">$0</span>
                                </div>
                                <kbd class="btn-shortcut-key">F1</kbd>
                            </button>
                        </div>
                        <div class="col-6">
                            <button id="btnPagoRapidoTransferencia" class="btn btn-primary btn-lg w-100 btn-pago-rapido"
                                data-metodo="transferencia" style="--btn-bg-color: #0d6efd;">
                                <div class="d-flex justify-content-between align-items-center w-100">
                                    <span><i class="fas fa-exchange-alt me-2"></i>Transfer.</span>
                                    <span id="montoTransferenciaRapido" class="badge bg-light text-dark ms-2">$0</span>
                                </div>
                                <kbd class="btn-shortcut-key">F2</kbd>
                            </button>
                        </div>
                        <div class="col-6">
                            <button id="btnPagoRapidoDebito" class="btn btn-secondary btn-lg w-100 btn-pago-rapido"
                                data-metodo="debito" style="--btn-bg-color: #6c757d;">
                                <div class="d-flex justify-content-between align-items-center w-100">
                                    <span><i class="fas fa-credit-card me-1"></i>Débito<span class="mx-1 text-white-50">|</span><i class="fas fa-qrcode me-1"></i>QR</span>
                                    <span id="montoDebitoRapido" class="badge bg-light text-dark ms-2">$0</span>
                                </div>
                                <kbd class="btn-shortcut-key">F3</kbd>
                            </button>
                        </div>
                        <div class="col-6">
                            <button id="btnPagoRapidoCredito" class="btn btn-warning btn-lg w-100 btn-pago-rapido"
                                data-metodo="credito" style="--btn-bg-color: #ffc107;">
                                <div class="d-flex justify-content-between align-items-center w-100">
                                    <span><i class="far fa-credit-card me-2"></i>Crédito</span>
                                    <span id="montoCreditoRapido" class="badge bg-light text-dark ms-2">$0</span>
                                </div>
                                <kbd class="btn-shortcut-key">F4</kbd>
                            </button>
                        </div>
                        <div class="col-12 mt-1">
                            <button id="btnPagoRapidoCuentaCorriente" class="btn btn-dark btn-lg w-100 btn-pago-rapido border border-warning"
                                data-metodo="cuentaCorriente" style="--btn-bg-color: #212529;">
                                <div class="d-flex justify-content-between align-items-center w-100">
                                    <span class="text-warning"><i class="fas fa-user-clock me-2"></i>A Cuenta (Fiado)</span>
                                    <span id="montoCuentaCorrienteRapido" class="badge bg-warning text-dark ms-2">$0</span>
                                </div>
                                <kbd class="btn-shortcut-key bg-warning text-dark">F7</kbd>
                            </button>
                        </div>
                    </div>



                    <div class="text-center">
                        <a data-bs-toggle="collapse" href="#collapsePagosManuales" role="button" aria-expanded="false"
                            aria-controls="collapsePagosManuales" class="link-secondary small">
                            Pago Manual / Dividido <i class="fas fa-chevron-down small"></i>
                        </a>
                    </div>

                    <div class="collapse" id="collapsePagosManuales">
                        <hr>
                        <div class="row g-3 mt-2">
                            <div class="col-md-6">
                                <label for="txtContado" class="form-label">Contado:</label>
                                <input type="number" class="form-control campo-pago" id="txtContado" value="0" step="1"
                                    placeholder="0">
                            </div>
                            <div class="col-md-6">
                                <label for="txtTransferencia" class="form-label">Transferencia:</label>
                                <input type="number" class="form-control campo-pago" id="txtTransferencia" value="0"
                                    step="1" placeholder="0">
                            </div>
                            <div class="col-md-6">
                                <label for="txtDebito" class="form-label">Débito | QR:</label>
                                <input type="number" class="form-control campo-pago" id="txtDebito" value="0" step="1"
                                    placeholder="0">
                            </div>
                            <div class="col-md-6">
                                <label for="txtCredito" class="form-label">Crédito:</label>
                                <div class="input-group">
                                    <input type="number" class="form-control campo-pago" id="txtCredito" value="0"
                                        step="1" placeholder="0">
                                    <span class="input-group-text">
                                        <input type="number" class="form-control form-control-sm text-center"
                                             id="txtRecargoCredito" value="10" style="width: 60px;">
                                        <span>%</span>
                                    </span>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <label for="txtCuentaCorriente" class="form-label text-warning-emphasis fw-bold">
                                    <i class="fas fa-user-clock me-1"></i>A Cuenta (Fiado / Pendiente de Pago):
                                </label>
                                <input type="number" class="form-control campo-pago border-warning" id="txtCuentaCorriente" value="0"
                                    step="1" placeholder="0">
                                <small class="text-muted">Se sumará al saldo adeudado del cliente seleccionado.</small>
                            </div>
                        </div>
                        <div class="card-footer bg-light">
                            <button id="btnFinalizarVenta" class="btn btn-success w-100 btn-lg" disabled><i
                                    class="fas fa-check-circle me-2"></i>Finalizar y Guardar Venta</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
