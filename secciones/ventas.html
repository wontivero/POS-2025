<section id="seccion-ventas">
    <div class="row">
        <div class="col-md-7">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-search me-2"></i>Buscar Productos</h5>
                </div>
                <div class="card-body">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="productoSearch"
                            placeholder="Buscar por nombre o código..." autocomplete="off">
                        <button class="btn btn-outline-primary" type="button" id="btnCrearProductoVentas">
                            <i class="fas fa-plus-circle me-1"></i> Crear Producto
                        </button>
                    </div>
                    <div class="list-group" id="searchResults">
                    </div>
                </div>
            </div>

            <div class="row g-2" id="quick-access-products">
            </div>
        </div>

        <div class="col-md-5">
            <!-- Tarjeta de Selector de Cliente Modernizada -->
            <div class="card shadow-sm mb-4 cliente-selector-card">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-2">
                    <h6 class="mb-0 fw-bold"><i class="fa-solid fa-user me-2"></i>Cliente</h6>
                    <button class="btn btn-sm btn-light text-primary fw-bold py-0 px-2 shadow-sm" type="button" id="btnNuevoClienteRapido" title="Crear nuevo cliente">
                        <i class="fas fa-plus me-1"></i>Nuevo
                    </button>
                </div>
                <div class="card-body p-3">
                    <!-- Buscador inteligente con autocomplete flotante -->
                    <div class="position-relative mb-2">
                        <div class="cliente-search-wrapper">
                            <span class="search-icon">
                                <i class="fas fa-search"></i>
                            </span>
                            <input type="text" id="clienteSearch"
                                placeholder="Buscar por nombre, DNI o teléfono..." autocomplete="off">
                            <button type="button" id="btnLimpiarClienteSearch" style="display: none;" title="Limpiar búsqueda">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <!-- Lista flotante de resultados -->
                        <div id="clienteSearchResults" class="list-group shadow-lg position-absolute w-100 mt-1"
                            style="display: none; max-height: 250px; overflow-y: auto; z-index: 1050; border-radius: 0.5rem;">
                        </div>
                    </div>

                    <!-- Ficha visual del Cliente Seleccionado -->
                    <div id="clienteSeleccionadoCard" class="p-2 rounded border bg-light d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center overflow-hidden">
                            <div id="clienteAvatarCircle" class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center fw-bold me-2 flex-shrink-0" style="width: 38px; height: 38px; font-size: 0.95rem;">
                                CF
                            </div>
                            <div class="text-truncate">
                                <div class="d-flex align-items-center gap-2">
                                    <span id="clienteNombreDisplay" class="fw-bold text-dark text-truncate" style="font-size: 0.95rem;">Consumidor Final</span>
                                    <span id="clienteSaldoBadge" class="badge bg-secondary-subtle text-secondary small" style="font-size: 0.72rem;">Sin cuenta</span>
                                </div>
                                <div class="small text-muted text-truncate" id="clienteDetalleExtra">
                                    <span>Venta general al público</span>
                                </div>
                            </div>
                        </div>

                        <!-- Acciones del cliente seleccionado -->
                        <div class="d-flex gap-1 flex-shrink-0 ms-2">
                            <button class="btn btn-sm btn-outline-primary py-1 px-2" type="button" id="btnEditarCliente" style="display:none;" title="Editar datos del cliente">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger py-1 px-2" type="button" id="btnDeseleccionarCliente" style="display:none;" title="Volver a Consumidor Final">
                                <i class="fas fa-user-xmark"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0"><i class="fas fa-shopping-cart me-2"></i>Ticket de Compra</h5>
                </div>
                <div class="card-body">
                    <div class="list-group" id="ticketItems">
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-end align-items-center bg-light">
                    <h4 class="mb-0">Total: <span id="totalVenta" class="text-primary fw-bold">$0</span></h4>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0"><i class="fas fa-money-bill-wave me-2"></i>Métodos de Pago</h5>
                </div>

                <div class="card-body">
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <button id="btnPagoRapidoContado" class="btn btn-success btn-lg w-100 btn-pago-rapido"
                                data-metodo="contado" style="--btn-bg-color: #198754;">
                                <div class="d-flex justify-content-between align-items-center w-100">
                                    <span><i class="fas fa-hand-holding-usd me-2"></i>Contado</span>
                                    <span id="montoContadoRapido" class="badge bg-light text-dark ms-2">$0</span>
                                </div>
                                <kbd class="btn-shortcut-key">F1</kbd>
                            </button>
                        </div>
                        <div class="col-6">
                            <button id="btnPagoRapidoTransferencia" class="btn btn-primary btn-lg w-100 btn-pago-rapido"
                                data-metodo="transferencia" style="--btn-bg-color: #0d6efd;">
                                <div class="d-flex justify-content-between align-items-center w-100">
                                    <span><i class="fas fa-exchange-alt me-2"></i>Transfer.</span>
                                    <span id="montoTransferenciaRapido" class="badge bg-light text-dark ms-2">$0</span>
                                </div>
                                <kbd class="btn-shortcut-key">F2</kbd>
                            </button>
                        </div>
                        <div class="col-6">
                            <button id="btnPagoRapidoDebito" class="btn btn-secondary btn-lg w-100 btn-pago-rapido"
                                data-metodo="debito" style="--btn-bg-color: #6c757d;">
                                <div class="d-flex justify-content-between align-items-center w-100">
                                    <span><i class="fas fa-credit-card me-1"></i>Débito<span class="mx-1 text-white-50">|</span><i class="fas fa-qrcode me-1"></i>QR</span>
                                    <span id="montoDebitoRapido" class="badge bg-light text-dark ms-2">$0</span>
                                </div>
                                <kbd class="btn-shortcut-key">F3</kbd>
                            </button>
                        </div>
                        <div class="col-6">
                            <button id="btnPagoRapidoCredito" class="btn btn-warning btn-lg w-100 btn-pago-rapido"
                                data-metodo="credito" style="--btn-bg-color: #ffc107;">
                                <div class="d-flex justify-content-between align-items-center w-100">
                                    <span><i class="far fa-credit-card me-2"></i>Crédito</span>
                                    <span id="montoCreditoRapido" class="badge bg-light text-dark ms-2">$0</span>
                                </div>
                                <kbd class="btn-shortcut-key">F4</kbd>
                            </button>
                        </div>
                        <!-- NUEVO BOTÓN: A Cuenta (Fiado) F7 -->
                        <div class="col-12">
                            <button id="btnPagoRapidoACuenta" class="btn btn-purple btn-lg w-100 btn-pago-rapido"
                                data-metodo="a_cuenta" style="--btn-bg-color: #6f42c1;" disabled>
                                <div class="d-flex justify-content-between align-items-center w-100">
                                    <span><i class="fas fa-file-invoice-dollar me-2"></i>A Cuenta (Fiado)</span>
                                    <div class="d-flex align-items-center gap-2">
                                        <span id="badgeACuentaEstado" class="badge bg-light text-dark small" style="font-size: 0.72rem;">Req. Cliente</span>
                                        <span id="montoACuentaRapido" class="badge bg-light text-dark ms-1">$0</span>
                                    </div>
                                </div>
                                <kbd class="btn-shortcut-key">F7</kbd>
                            </button>
                        </div>
                    </div>

                    <div class="text-center">
                        <a data-bs-toggle="collapse" href="#collapsePagosManuales" role="button" aria-expanded="false"
                            aria-controls="collapsePagosManuales" class="link-secondary small">
                            Pago Manual / Dividido <i class="fas fa-chevron-down small"></i>
                        </a>
                    </div>

                    <div class="collapse" id="collapsePagosManuales">
                        <hr>
                        <div class="row g-3 mt-2">
                            <div class="col-md-6">
                                <label for="txtContado" class="form-label">Contado:</label>
                                <input type="number" class="form-control campo-pago" id="txtContado" value="0" step="1"
                                    placeholder="0">
                            </div>
                            <div class="col-md-6">
                                <label for="txtTransferencia" class="form-label">Transferencia:</label>
                                <input type="number" class="form-control campo-pago" id="txtTransferencia" value="0"
                                    step="1" placeholder="0">
                            </div>
                            <div class="col-md-6">
                                <label for="txtDebito" class="form-label">Débito | QR:</label>
                                <input type="number" class="form-control campo-pago" id="txtDebito" value="0" step="1"
                                    placeholder="0">
                            </div>
                            <div class="col-md-6">
                                <label for="txtCredito" class="form-label">Crédito:</label>
                                <div class="input-group">
                                    <input type="number" class="form-control campo-pago" id="txtCredito" value="0"
                                        step="1" placeholder="0">
                                    <span class="input-group-text">
                                        <input type="number" class="form-control form-control-sm text-center"
                                             id="txtRecargoCredito" value="10" style="width: 60px;">
                                        <span>%</span>
                                    </span>
                                </div>
                            </div>
                            <!-- NUEVO CAMPO MANUAL: A Cuenta -->
                            <div class="col-md-12">
                                <label for="txtACuenta" class="form-label d-flex justify-content-between align-items-center">
                                    <span><i class="fas fa-file-invoice-dollar me-1 text-purple"></i>A Cuenta (Fiado):</span>
                                    <small id="txtACuentaHelp" class="text-danger small fw-normal" style="display:none;"><i class="fas fa-lock me-1"></i>Requiere cliente seleccionado</small>
                                </label>
                                <input type="number" class="form-control campo-pago" id="txtACuenta" value="0" step="1"
                                    placeholder="0">
                            </div>
                        </div>
                        <div class="card-footer bg-light mt-3">
                            <button id="btnFinalizarVenta" class="btn btn-success w-100 btn-lg" disabled><i
                                    class="fas fa-check-circle me-2"></i>Finalizar y Guardar Venta</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
